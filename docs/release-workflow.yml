name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt gallery-dl

      - name: Build
        shell: cmd
        run: scripts\build_release.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-Track-windows
          path: release/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP=$(ls release/*.zip | head -n1)
          gh release create "$TAG" "$ZIP" --title "X-Track ${TAG#v}" --generate-notes || \
          gh release upload "$TAG" "$ZIP" --clobber
